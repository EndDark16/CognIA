name: Deploy Backend (Best Effort)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  backend_deploy_best_effort:
    name: backend-deploy-best-effort
    runs-on: [self-hosted, linux, x64, cognia-backend]
    timeout-minutes: 45
    env:
      DEPLOY_BRANCH: main
      BACKEND_REPO_DIR: /opt/cognia/backend
      COMPOSE_DIR: /opt/cognia
      EXPECTED_SHA: ${{ github.sha }}
      READY_URL: http://localhost/readyz
      RUNTIME_ARTIFACT_SEARCH_ROOTS: >-
        /opt/cognia/runtime_artifacts/models/active_modes:/opt/cognia/runtime_artifacts:/opt/cognia/backend/models/active_modes:/opt/cognia/backend:/opt:/home:/root:/srv:/mnt:/var/lib:/mnt/c/Users/andre/Documents/Workspace Academic/Backend Tesis/cognia_app/models/active_modes:/mnt/c/Users/andre/Documents/Workspace Academic/Backend Tesis/cognia_app:/mnt/c/Users/andre/Documents/cognia_clean_work/cognia_runtime_draft_fix_clean2/models/active_modes

    steps:
      - name: Validate server paths
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$BACKEND_REPO_DIR/.git"
          test -d "$COMPOSE_DIR"

      - name: Deploy with automatic rollback
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          PYTHON_BIN="${PYTHON_BIN:-python3}"
          if ! command -v "$PYTHON_BIN" >/dev/null 2>&1; then
            PYTHON_BIN="python"
          fi

          sync_runtime_artifacts() {
            cd "$BACKEND_REPO_DIR"
            "$PYTHON_BIN" scripts/sync_runtime_artifacts_from_local_store.py --strict
          }

          hydrate_lfs_artifacts() {
            cd "$BACKEND_REPO_DIR"
            if ! git lfs version >/dev/null 2>&1; then
              echo "::error::git-lfs is required on deploy host to materialize tracked runtime artifacts."
              return 1
            fi
            git lfs install --local
            git lfs pull origin "$DEPLOY_SHA"
          }

          inspect_runtime_sources() {
            IFS=':' read -r -a roots <<< "${RUNTIME_ARTIFACT_SEARCH_ROOTS:-}"
            echo "[runtime-source-inspect] configured_roots=${#roots[@]}"
            for root in "${roots[@]}"; do
              [ -z "$root" ] && continue
              if [ -d "$root" ]; then
                count="$( (find "$root" -maxdepth 3 -type f -name '*.joblib' 2>/dev/null || true) | wc -l | tr -d ' ' )"
                echo "[runtime-source-inspect] exists root=$root joblib_count=$count"
              else
                echo "[runtime-source-inspect] missing root=$root"
              fi
            done
          }

          deploy_compose() {
            cd "$COMPOSE_DIR"
            docker compose up -d --build backend
            docker compose up -d --force-recreate gateway
          }

          validate_runtime_artifacts() {
            cd "$COMPOSE_DIR"
            docker compose exec -T backend python scripts/bootstrap_questionnaire_backend_v2.py load-models
            docker compose exec -T backend python scripts/run_runtime_artifact_validation_v17.py
          }

          check_readyz() {
            local attempts=24
            local delay=5
            local n=1

            while [ "$n" -le "$attempts" ]; do
              if curl -fsS "$READY_URL" >/tmp/cognia_readyz_response.txt; then
                echo "readyz OK (attempt $n/$attempts)"
                cat /tmp/cognia_readyz_response.txt
                return 0
              fi
              echo "readyz not ready yet (attempt $n/$attempts), retrying in ${delay}s"
              sleep "$delay"
              n=$((n + 1))
            done

            return 1
          }

          cd "$BACKEND_REPO_DIR"
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "Previous deployed commit: $PREVIOUS_SHA"
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

          git fetch --prune origin "$DEPLOY_BRANCH"
          REMOTE_SHA="$(git rev-parse "origin/$DEPLOY_BRANCH")"
          echo "Remote $DEPLOY_BRANCH commit: $REMOTE_SHA"
          DEPLOY_SHA="$EXPECTED_SHA"
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            DEPLOY_SHA="$REMOTE_SHA"
            echo "workflow_dispatch detected; deploying latest origin/$DEPLOY_BRANCH: $DEPLOY_SHA"
          elif [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected workflow SHA $EXPECTED_SHA but origin/$DEPLOY_BRANCH resolved $REMOTE_SHA."
            echo "final_status=sha_mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git checkout -B "$DEPLOY_BRANCH" "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"

          TARGET_SHA="$(git rev-parse HEAD)"
          echo "Target commit after update: $TARGET_SHA"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          hydrate_lfs_artifacts
          inspect_runtime_sources
          sync_runtime_artifacts

          deploy_compose

          if check_readyz && validate_runtime_artifacts; then
            echo "final_status=deployed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Post-deploy readyz check failed for $TARGET_SHA. Rolling back to $PREVIOUS_SHA"
          cd "$BACKEND_REPO_DIR"
          git reset --hard "$PREVIOUS_SHA"

          ROLLBACK_SHA="$(git rev-parse HEAD)"
          echo "Rollback commit: $ROLLBACK_SHA"
          echo "rollback_sha=$ROLLBACK_SHA" >> "$GITHUB_OUTPUT"

          deploy_compose

          if check_readyz; then
            echo "final_status=rolled_back" >> "$GITHUB_OUTPUT"
            echo "::error::Deployment to $TARGET_SHA failed; rollback to $PREVIOUS_SHA succeeded."
            exit 1
          fi

          echo "final_status=rollback_failed" >> "$GITHUB_OUTPUT"
          echo "::error::Deployment and rollback both failed readiness verification."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Backend deploy summary"
            echo "- Previous SHA: ${{ steps.deploy.outputs.previous_sha || 'n/a' }}"
            echo "- Expected SHA: ${{ github.sha }}"
            echo "- Target SHA: ${{ steps.deploy.outputs.target_sha || 'n/a' }}"
            echo "- Rollback SHA: ${{ steps.deploy.outputs.rollback_sha || 'n/a' }}"
            echo "- Final status: ${{ steps.deploy.outputs.final_status || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker compose status and backend logs
        if: always()
        shell: bash
        run: |
          set +e
          cd "$COMPOSE_DIR"
          docker compose ps
          echo "----- backend logs (last 200 lines) -----"
          docker compose logs --tail=200 backend
          echo "----- gateway logs (last 200 lines) -----"
          docker compose logs --tail=200 gateway
